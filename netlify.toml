# Netlify configuration — security headers only (build/runtime handled by the
# Next.js Netlify adapter / dashboard settings, intentionally left untouched).

[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years, including subdomains, and allow preload-list inclusion.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Lock down powerful features this site never uses.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # CSP kept Next.js-compatible: inline styles/scripts are required by the
    # framework (no nonce pipeline), fonts are self-hosted by next/font.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Long-cache immutable static assets.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
